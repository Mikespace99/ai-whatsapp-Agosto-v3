<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}AI Booking{% endblock %}</title>
    <style>
        body { font-family: -apple-system, sans-serif; max-width: 480px; margin: 60px auto; padding: 0 20px; color: #222; }
        input { display: block; width: 100%; padding: 10px; margin: 8px 0; box-sizing: border-box; }
        button { padding: 10px 20px; cursor: pointer; }
        .error { color: #b00020; margin: 10px 0; }
        .success { color: #0a7a2f; margin: 10px 0; }
        a { color: #2a5db0; }
    </style>
</head>
<body>
    {% block content %}{% endblock %}
</body>
</html>
