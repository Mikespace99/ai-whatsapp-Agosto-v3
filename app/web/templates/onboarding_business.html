{% extends "base.html" %}
{% block title %}La tua attività{% endblock %}
{% block content %}
<h1>Parlaci della tua attività</h1>

{% if error %}
<p class="error">{{ error }}</p>
{% endif %}

<form method="post" action="/onboarding/business">
    <label>Nome attività *</label>
    <input type="text" name="business_name" placeholder="Es. Estetica Bellavista" required>

    <label>Nome assistente (opzionale)</label>
    <input type="text" name="assistant_name" placeholder="Es. Sofia">

    <label>Fuso orario *</label>
    <select name="timezone" required>
        <option value="Europe/Rome" selected>Europe/Rome (Italia)</option>
        <option value="Europe/London">Europe/London</option>
        <option value="UTC">UTC</option>
    </select>

    <label>Lingua *</label>
    <select name="language" required>
        <option value="it" selected>Italiano</option>
        <option value="en">English</option>
    </select>

    <button type="submit">Continua</button>
</form>
{% endblock %}
