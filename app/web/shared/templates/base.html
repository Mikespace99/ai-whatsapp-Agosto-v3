<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Il tuo assistente prenotazioni{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #F3F4EF;
            --surface: #FFFFFF;
            --ink: #16241F;
            --ink-soft: #55635C;
            --teal: #0B5C4C;
            --teal-tint: #E4EFE9;
            --rose: #B23A56;
            --rose-tint: #F6E4E9;
            --sand: #DCD7C8;
            --amber: #8A5A16;
            --amber-tint: #F4E9D4;
            --radius: 14px;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--ink);
            font-family: 'Inter', sans-serif;
            font-size: 16px;
            line-height: 1.5;
        }

        h1, h2, h3 {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 600;
            letter-spacing: -0.01em;
            margin: 0 0 8px;
        }

        .eyebrow {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 12px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--ink-soft);
        }

        .shell {
            max-width: 640px;
            margin: 0 auto;
            padding: 48px 20px 80px;
        }

        .shell-narrow {
            max-width: 420px;
            margin: 0 auto;
            padding: 64px 20px;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--sand);
            border-radius: var(--radius);
            padding: 28px;
            margin-bottom: 16px;
        }

        .card.current { border-color: var(--teal); box-shadow: 0 0 0 3px var(--teal-tint); }

        .card.locked { opacity: 0.55; }

        .card.locked .card-title { color: var(--ink-soft); }

        .step-row {
            display: flex;
            align-items: flex-start;
            gap: 14px;
        }

        .step-number {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 13px;
            color: var(--ink-soft);
            padding-top: 3px;
            min-width: 22px;
        }

        .card-title { font-size: 18px; margin-bottom: 4px; }

        .card-desc { color: var(--ink-soft); font-size: 14px; margin: 0; }

        .stamp {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 34px;
            height: 34px;
            border: 2px dashed var(--teal);
            border-radius: 50%;
            color: var(--teal);
            font-size: 16px;
            transform: rotate(-8deg);
            flex-shrink: 0;
        }

        .pending-dot {
            display: inline-block;
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: var(--sand);
            margin-top: 6px;
            flex-shrink: 0;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            margin: 18px 0 6px;
            color: var(--ink-soft);
        }

        label:first-of-type { margin-top: 20px; }

        input, select {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid var(--sand);
            border-radius: 8px;
            font-family: 'Inter', sans-serif;
            font-size: 15px;
            background: var(--bg);
            color: var(--ink);
        }

        input:focus, select:focus, button:focus, a:focus {
            outline: 2px solid var(--teal);
            outline-offset: 1px;
        }

        button, .btn {
            display: inline-block;
            margin-top: 22px;
            padding: 12px 22px;
            background: var(--rose);
            color: white;
            border: none;
            border-radius: 8px;
            font-family: 'Inter', sans-serif;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
        }

        button:hover, .btn:hover { background: #9a3049; }

        .error {
            background: var(--rose-tint);
            color: var(--rose);
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 14px;
            margin: 16px 0 0;
        }

        .success-banner {
            background: var(--teal-tint);
            color: var(--teal);
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 14px;
            display: inline-block;
        }

        .warning-banner {
            background: var(--amber-tint);
            color: var(--amber);
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 14px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .muted-link { color: var(--ink-soft); font-size: 14px; }
        .muted-link a { color: var(--teal); text-decoration: none; }

        @media (prefers-reduced-motion: no-preference) {
            .card { animation: rise 0.35s ease-out both; }
            @keyframes rise {
                from { opacity: 0; transform: translateY(6px); }
                to { opacity: 1; transform: translateY(0); }
            }
        }
    </style>
</head>
<body>
    {% block content %}{% endblock %}
</body>
</html>
