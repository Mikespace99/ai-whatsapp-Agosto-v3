{% macro step_card(number, title, description, status) %}
<div class="card {{ 'current' if status == 'current' else ('locked' if status == 'locked' else '') }}">
    <div class="step-row">
        {% if status == 'done' %}
        <span class="stamp">✓</span>
        {% elif status in ('current', 'todo') %}
        <span class="step-number">{{ number }}</span>
        {% else %}
        <span class="pending-dot"></span>
        {% endif %}
        <div>
            <p class="card-title">{{ title }}</p>
            <p class="card-desc">{{ description }}</p>
        </div>
    </div>
    {{ caller() if caller else "" }}
</div>
{% endmacro %}
