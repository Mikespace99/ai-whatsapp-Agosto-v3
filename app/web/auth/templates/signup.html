{% extends "base.html" %}
{% block title %}Registrati{% endblock %}
{% block content %}
<div class="shell-narrow">
    <p class="eyebrow">Passo 1 di 2</p>
    <h1>Crea il tuo account</h1>
    <p class="card-desc">Poi configuri l'attività — due minuti.</p>

    {% if error %}
    <p class="error">{{ error }}</p>
    {% endif %}

    <form method="post" action="/signup">
        <label>Email</label>
        <input type="email" name="email" placeholder="nome@attività.it" required>

        <label>Password</label>
        <input type="password" name="password" placeholder="Almeno 6 caratteri" required minlength="6">

        <button type="submit">Registrati</button>
    </form>

    <p class="muted-link" style="margin-top:18px;">Hai già un account? <a href="/login">Accedi</a></p>
</div>
{% endblock %}
