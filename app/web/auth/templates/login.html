{% extends "base.html" %}
{% block title %}Accedi{% endblock %}
{% block content %}
<div class="shell-narrow">
    <p class="eyebrow">Bentornato</p>
    <h1>Accedi</h1>

    {% if error %}
    <p class="error">{{ error }}</p>
    {% endif %}

    <form method="post" action="/login">
        <label>Email</label>
        <input type="email" name="email" placeholder="nome@attività.it" required>

        <label>Password</label>
        <input type="password" name="password" placeholder="La tua password" required>

        <button type="submit">Accedi</button>
    </form>

    <p class="muted-link" style="margin-top:18px;">Non hai un account? <a href="/signup">Registrati</a></p>
</div>
{% endblock %}
