{% extends "base.html" %}
{% block title %}Domande frequenti{% endblock %}
{% block content %}
<div class="shell">
    <p class="eyebrow">Onboarding — opzionale</p>
    <h1>Domande frequenti</h1>

    {% if faqs %}
    <div class="card">
        {% for f in faqs %}
        <div style="padding:10px 0; border-bottom:1px solid var(--sand);">
            <div style="display:flex; justify-content:space-between; align-items:flex-start;">
                <strong>{{ f.question }}</strong>
                <form method="post" action="/onboarding/faq/delete/{{ f.id }}">
                    <button type="submit" style="margin:0; background:transparent; color:var(--rose); padding:2px 6px; font-size:13px;">Rimuovi</button>
                </form>
            </div>
            <p class="card-desc">{{ f.answer }}</p>
        </div>
        {% endfor %}
    </div>
    {% endif %}

    <div class="card">
        <p class="card-title" style="margin-bottom:14px;">Aggiungi una FAQ</p>
        <form method="post" action="/onboarding/faq">
            <label>Domanda</label>
            <input type="text" name="question" placeholder="Es. Fate parcheggio?" required>

            <label>Risposta</label>
            <input type="text" name="answer" placeholder="Es. Sì, parcheggio gratuito davanti al negozio" required>

            <button type="submit">Aggiungi</button>
        </form>
    </div>

    <p class="muted-link"><a href="/onboarding">← Torna alla panoramica</a></p>
</div>
{% endblock %}
