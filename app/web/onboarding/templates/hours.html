{% extends "base.html" %}
{% block title %}Orari di apertura{% endblock %}
{% block content %}
<div class="shell">
    <p class="eyebrow">Onboarding</p>
    <h1>Orari di apertura</h1>

    <div class="card">
        <form method="post" action="/onboarding/hours">
            {% for day in days %}
            <div style="display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--sand);">
                <div style="width:110px; font-weight:500; font-size:14px;">{{ day.label }}</div>
                <input type="time" name="open_{{ day.key }}" value="{{ day.open_time or '09:00' }}" style="width:120px; margin:0;">
                <span style="color:var(--ink-soft);">—</span>
                <input type="time" name="close_{{ day.key }}" value="{{ day.close_time or '18:00' }}" style="width:120px; margin:0;">
                <label style="display:flex; align-items:center; gap:6px; margin:0; font-size:13px;">
                    <input type="checkbox" name="closed_{{ day.key }}" style="width:auto; margin:0;" {{ 'checked' if day.closed else '' }}>
                    Chiuso
                </label>
            </div>
            {% endfor %}
            <button type="submit">Salva orari</button>
        </form>
    </div>

    <p class="muted-link"><a href="/onboarding">← Torna alla panoramica</a></p>
</div>
{% endblock %}
